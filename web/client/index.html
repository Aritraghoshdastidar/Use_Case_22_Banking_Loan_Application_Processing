<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marigold Finance</title>
<meta name="description" content="Apply for a personal or home loan, upload your documents, and watch your application move through verification, scoring and decision.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-15 -15 30 30'%3E%3Cg fill='%23D6A23A'%3E%3Cellipse cy='-7' rx='3.6' ry='7.4'/%3E%3Cellipse cy='-7' rx='3.6' ry='7.4' transform='rotate(90)'/%3E%3Cellipse cy='-7' rx='3.6' ry='7.4' transform='rotate(180)'/%3E%3Cellipse cy='-7' rx='3.6' ry='7.4' transform='rotate(270)'/%3E%3C/g%3E%3Ccircle r='3.2' fill='%230D5A4E'/%3E%3C/svg%3E">
</head>
<body>
<header class="site">
  <div class="in"><div class="bar">
    <a class="brand" href="#/" aria-label="Marigold Finance home">
      <svg width="30" height="30" viewBox="-15 -15 30 30" aria-hidden="true" id="mark"></svg>
      <span>Marigold Finance<small id="areaLabel">Personal and home loans</small></span>
    </a>
    <nav class="main" id="nav" aria-label="Main"></nav>
    <div class="tools">
      <button class="switch" id="proofSwitch" role="switch" aria-checked="false"><span class="track"></span>Proof mode</button>
      <div class="who" id="who"></div>
    </div>
  </div></div>
  <div class="strip" aria-hidden="true"><svg id="stripSvg" preserveAspectRatio="none"></svg></div>
  <div class="subbar" id="subbar" hidden><div class="in"><div class="bar">
    <span class="eyebrow">Environment</span>
    <div class="seg" id="envSeg" role="group" aria-label="Environment"></div>
    <span class="small muted" id="envNote"></span>
  </div></div></div>
</header>
<main id="main" tabindex="-1"><div class="loading">Loading…</div></main>
<footer class="site"><div class="in"><span>Marigold Finance is a demonstration lender. It is not a real financial institution.</span><span class="mono" id="footEnv"></span></div></footer>
<div class="scrim" id="scrim" hidden></div>
<aside id="drawer" aria-hidden="true" aria-labelledby="dTitle" role="dialog">
  <div class="dh"><div><div class="eyebrow" id="dEyebrow"></div><h2 id="dTitle"></h2></div><button class="x" id="dClose" aria-label="Close">×</button></div>
  <div class="db" id="dBody"></div>
</aside>
<div class="toast" id="toast" hidden role="status"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
